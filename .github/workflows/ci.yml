name: Java DevOps CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/aashish-cyber/devops-java-lab

jobs:

  # ==========================================================
  # CI
  # ==========================================================
  build:
    name: Build, Test & Push Image
    runs-on: [self-hosted, linux, x64]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Java Version
        run: java --version

      - name: Check Maven Version
        run: mvn --version

      - name: Build and Test
        run: mvn clean package

      - name: Verify WAR Artifact
        run: |
          ls -lh target/*.war

      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "Image tag: ${GITHUB_SHA}"

      - name: Build Docker Image
        run: |
          docker build \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"


  # ==========================================================
  # BLUE/GREEN DEPLOYMENT
  # ==========================================================
  deploy:
    name: Blue/Green Deployment

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: build

    runs-on: [self-hosted, linux, x64]

    env:
      BLUE_CONTAINER: devops-java-deploy
      GREEN_CONTAINER: devops-java-green
      NGINX_CONTAINER: devops-nginx

      DOCKER_NETWORK: blue-green-net

      BLUE_PORT: 8082
      GREEN_PORT: 8083
      PRODUCTION_PORT: 8080

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ======================================================
      # 2. Generate Image Tag
      # ======================================================
      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

          echo "====================================="
          echo "NEW IMAGE"
          echo "====================================="

          echo "$IMAGE_NAME:$GITHUB_SHA"


      # ======================================================
      # 3. Login to GHCR
      # ======================================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # 4. Pull New Image
      # ======================================================
      - name: Pull New Image
        run: |
          docker pull "$IMAGE_NAME:$IMAGE_TAG"


      # ======================================================
      # 5. Verify BLUE
      # ======================================================
      - name: Verify Blue Environment
        run: |

          echo "====================================="
          echo "VERIFYING BLUE"
          echo "====================================="

          if ! docker inspect "$BLUE_CONTAINER" >/dev/null 2>&1; then
            echo "ERROR: Blue container does not exist."
            exit 1
          fi

          if ! docker ps \
            --filter "name=$BLUE_CONTAINER" \
            --filter "status=running" \
            -q | grep -q .; then

            echo "ERROR: Blue container is not running."
            exit 1
          fi

          echo "Blue container is running."

          echo ""
          echo "Blue image:"
          docker inspect "$BLUE_CONTAINER" \
            --format '{{.Config.Image}}'

          echo ""
          echo "Testing Blue directly..."

          curl -fsS \
            "http://localhost:$BLUE_PORT/devops-lab/" \
            > /tmp/blue.html

          cat /tmp/blue.html


      # ======================================================
      # 6. SAVE BLUE NGINX CONFIG
      # ======================================================
      - name: Save Blue Nginx Configuration
        run: |

          echo "====================================="
          echo "SAVING BLUE NGINX CONFIG"
          echo "====================================="

          cp nginx/nginx.conf /tmp/nginx-blue.conf

          echo ""
          echo "Blue configuration:"
          cat /tmp/nginx-blue.conf


      # ======================================================
      # 7. Remove Old GREEN
      # ======================================================
      - name: Remove Previous Green
        run: |

          echo "====================================="
          echo "REMOVING OLD GREEN"
          echo "====================================="

          docker rm -f "$GREEN_CONTAINER" 2>/dev/null || true


      # ======================================================
      # 8. Deploy New Version to GREEN
      # ======================================================
      - name: Deploy New Version to Green
        run: |

          echo "====================================="
          echo "DEPLOYING NEW VERSION TO GREEN"
          echo "====================================="

          docker run -d \
            --name "$GREEN_CONTAINER" \
            --network "$DOCKER_NETWORK" \
            -p "$GREEN_PORT:8080" \
            "$IMAGE_NAME:$IMAGE_TAG"

          echo ""
          echo "Green container:"
          docker ps --filter "name=$GREEN_CONTAINER"

          echo ""
          echo "Green image:"
          docker inspect "$GREEN_CONTAINER" \
            --format '{{.Config.Image}}'


      # ======================================================
      # 9. GREEN HEALTH CHECK
      # ======================================================
      - name: Health Check Green
        run: |

          echo "====================================="
          echo "HEALTH CHECK - GREEN"
          echo "====================================="

          for i in {1..12}; do

            echo "Health check attempt $i/12"

            if curl -fsS \
              "http://localhost:$GREEN_PORT/devops-lab/" \
              > /tmp/green.html; then

              echo ""
              echo "GREEN IS HEALTHY"
              echo ""

              cat /tmp/green.html

              exit 0
            fi

            sleep 5

          done

          echo ""
          echo "GREEN HEALTH CHECK FAILED"

          docker logs "$GREEN_CONTAINER" || true

          exit 1


      # ======================================================
      # 10. PREPARE GREEN NGINX CONFIG
      # ======================================================
      - name: Prepare Green Nginx Configuration
        run: |

          echo "====================================="
          echo "PREPARING GREEN NGINX CONFIG"
          echo "====================================="

          cp /tmp/nginx-blue.conf /tmp/nginx-green.conf

          sed -i \
            's/devops-java-deploy:8080/devops-java-green:8080/' \
            /tmp/nginx-green.conf

          echo ""
          echo "Green configuration:"
          cat /tmp/nginx-green.conf


      # ======================================================
      # 11. SWITCH TRAFFIC TO GREEN
      # ======================================================
      - name: Switch Traffic to Green
        run: |

          echo "====================================="
          echo "SWITCHING TRAFFIC"
          echo "BLUE -> GREEN"
          echo "====================================="

          cp /tmp/nginx-green.conf nginx/nginx.conf

          echo ""
          echo "Host Nginx configuration:"
          cat nginx/nginx.conf

          echo ""
          echo "Nginx configuration inside container:"
          docker exec "$NGINX_CONTAINER" \
            cat /etc/nginx/nginx.conf

          echo ""
          echo "Testing Nginx configuration..."

          docker exec "$NGINX_CONTAINER" nginx -t

          echo ""
          echo "Reloading Nginx..."

          docker exec "$NGINX_CONTAINER" nginx -s reload

          echo ""
          echo "Traffic switched to GREEN."


      # ======================================================
      # 12. VERIFY GREEN ROUTING
      # ======================================================
      - name: Verify Green Routing
        run: |

          echo "====================================="
          echo "VERIFYING GREEN ROUTING"
          echo "====================================="

          echo ""
          echo "Active Nginx configuration:"

          docker exec "$NGINX_CONTAINER" \
            nginx -T 2>&1

          echo ""
          echo "Checking Green upstream..."

          if ! docker exec "$NGINX_CONTAINER" \
            nginx -T 2>&1 | grep -q "devops-java-green:8080"; then

            echo "ERROR: Nginx is NOT pointing to GREEN."

            exit 1
          fi

          echo "SUCCESS: Nginx is pointing to GREEN."


      # ======================================================
      # 13. VERIFY PRODUCTION TRAFFIC
      # ======================================================
      - name: Verify Production Traffic
        run: |

          echo "====================================="
          echo "VERIFYING PRODUCTION TRAFFIC"
          echo "====================================="

          sleep 2

          curl -fsS \
            "http://localhost:$PRODUCTION_PORT/devops-lab/" \
            > /tmp/production.html

          echo ""
          echo "Production response:"
          cat /tmp/production.html

          echo ""
          echo "Production traffic is reaching GREEN."


      # ======================================================
      # 14. INTENTIONAL FAILURE
      #
      # REMOVE THIS STEP AFTER TESTING ROLLBACK
      # ======================================================
      - name: Simulate Production Failure
        run: |

          echo "====================================="
          echo "SIMULATING PRODUCTION FAILURE"
          echo "====================================="

          echo ""
          echo "GREEN is currently serving production."

          echo ""
          echo "Intentionally failing deployment..."

          exit 1


      # ======================================================
      # 15. DEPLOYMENT SUCCESS
      # ======================================================
      - name: Deployment Successful
        if: success()
        run: |

          echo "====================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "====================================="

          echo "Image: $IMAGE_NAME:$IMAGE_TAG"
          echo "Active environment: GREEN"


      # ======================================================
      # 16. AUTOMATIC ROLLBACK TO BLUE
      # ======================================================
      - name: Automatic Rollback to Blue
        if: failure()
        run: |

          echo "====================================="
          echo "DEPLOYMENT FAILED"
          echo "ROLLING BACK"
          echo "GREEN -> BLUE"
          echo "====================================="


          # --------------------------------------------------
          # Green logs
          # --------------------------------------------------
          echo ""
          echo "Green container logs:"

          docker logs "$GREEN_CONTAINER" 2>/dev/null || true


          # --------------------------------------------------
          # Restore BLUE configuration
          # --------------------------------------------------
          echo ""
          echo "Restoring BLUE Nginx configuration..."

          cp /tmp/nginx-blue.conf nginx/nginx.conf


          # --------------------------------------------------
          # Show host config
          # --------------------------------------------------
          echo ""
          echo "Host configuration after rollback:"

          cat nginx/nginx.conf


          # --------------------------------------------------
          # Show container config BEFORE reload
          # --------------------------------------------------
          echo ""
          echo "Nginx container configuration BEFORE reload:"

          docker exec "$NGINX_CONTAINER" \
            cat /etc/nginx/nginx.conf


          # --------------------------------------------------
          # Validate Nginx
          # --------------------------------------------------
          echo ""
          echo "Validating Nginx..."

          docker exec "$NGINX_CONTAINER" nginx -t


          # --------------------------------------------------
          # Reload Nginx
          # --------------------------------------------------
          echo ""
          echo "Reloading Nginx..."

          docker exec "$NGINX_CONTAINER" nginx -s reload


          # --------------------------------------------------
          # Show container config AFTER reload
          # --------------------------------------------------
          echo ""
          echo "Nginx container configuration AFTER reload:"

          docker exec "$NGINX_CONTAINER" \
            cat /etc/nginx/nginx.conf


          # --------------------------------------------------
          # Verify BLUE routing
          # --------------------------------------------------
          echo ""
          echo "====================================="
          echo "VERIFYING BLUE ROUTING"
          echo "====================================="

          if ! docker exec "$NGINX_CONTAINER" \
            nginx -T 2>&1 | grep -q "devops-java-deploy:8080"; then

            echo ""
            echo "ERROR: Nginx is NOT pointing to BLUE."

            echo ""
            echo "Actual Nginx configuration:"

            docker exec "$NGINX_CONTAINER" \
              nginx -T 2>&1 || true

            exit 1
          fi

          echo "SUCCESS: Nginx is pointing to BLUE."


          # --------------------------------------------------
          # Verify production
          # --------------------------------------------------
          echo ""
          echo "====================================="
          echo "VERIFYING PRODUCTION TRAFFIC"
          echo "====================================="

          sleep 2

          curl -fsS \
            "http://localhost:$PRODUCTION_PORT/devops-lab/" \
            > /tmp/rollback.html

          echo ""
          echo "Production response:"

          cat /tmp/rollback.html


          # --------------------------------------------------
          # Verify Blue Version
          #
          # Change V5 if your actual Blue version is different.
          # --------------------------------------------------
          echo ""
          echo "Checking Blue application version..."

          if ! grep -q "Application Versioning:V5" /tmp/rollback.html; then

            echo ""
            echo "ERROR: Production is NOT serving BLUE V5."

            exit 1
          fi


          # --------------------------------------------------
          # SUCCESS
          # --------------------------------------------------
          echo ""
          echo "====================================="
          echo "ROLLBACK SUCCESSFUL"
          echo "====================================="

          echo ""
          echo "Traffic:"
          echo "Production -> Nginx -> Blue"

          echo ""
          echo "Blue version:"
          echo "V5"

          echo ""
          echo "Green version:"
          echo "V6"

          echo ""
          echo "====================================="


      # ======================================================
      # 17. FINAL STATE
      # ======================================================
      - name: Show Final Container State
        if: always()
        run: |

          echo "====================================="
          echo "FINAL CONTAINER STATE"
          echo "====================================="

          docker ps \
            --filter "name=$BLUE_CONTAINER" \
            --filter "name=$GREEN_CONTAINER" \
            --filter "name=$NGINX_CONTAINER" \
            --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}"

          echo ""
          echo "====================================="
          echo "FINAL NGINX CONFIG"
          echo "====================================="

          docker exec "$NGINX_CONTAINER" \
            nginx -T 2>&1 || true
