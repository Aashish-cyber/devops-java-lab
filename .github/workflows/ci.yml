name: Java DevOps CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/aashish-cyber/devops-java-lab

concurrency:
  group: java-devops-lab-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Push Image
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Java Version
        run: java --version

      - name: Check Maven Version
        run: mvn --version

      - name: Build and Test
        run: mvn clean package

      - name: Verify WAR Artifact
        run: ls -lh target/*.war

      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: |
          docker build \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        if: github.event_name == 'push'
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"

  deploy:
    name: Blue/Green Deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Deployment Prerequisites
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="/home/ranaa/devops-lab/java-tomcat"

          test -f "$PROJECT_DIR/.env"
          test -f "$PROJECT_DIR/compose.yaml"
          test -f "$PROJECT_DIR/nginx/nginx.conf"
          test -f "$GITHUB_WORKSPACE/scripts/deploy-compose.sh"

          bash -n "$GITHUB_WORKSPACE/scripts/deploy-compose.sh"

          docker compose \
            -p java-devops-lab \
            -f "$PROJECT_DIR/compose.yaml" \
            config --quiet

          docker compose \
            -p java-devops-lab \
            -f "$PROJECT_DIR/compose.yaml" \
            ps

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy New Image
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail

          bash "$GITHUB_WORKSPACE/scripts/deploy-compose.sh" \
            "$DEPLOY_IMAGE"

      - name: Show Final State
        if: always()
        shell: bash
        run: |
          PROJECT_DIR="/home/ranaa/devops-lab/java-tomcat"

          docker compose \
            -p java-devops-lab \
            -f "$PROJECT_DIR/compose.yaml" \
            ps -a

          curl -fsS \
            http://localhost:8080/devops-lab/ || true

          grep 'server devops-java-' \
            "$PROJECT_DIR/nginx/nginx.conf" || true
