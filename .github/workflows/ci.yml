name: Java DevOps CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/aashish-cyber/devops-java-lab

jobs:

  # ==========================================
  # CI JOB
  # ==========================================
  build:
    name: Build, Test & Push Image
    runs-on: [self-hosted, linux, x64]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Java Version
        run: java --version

      - name: Check Maven Version
        run: mvn --version

      - name: Build and Test
        run: mvn clean package

      - name: Verify WAR Artifact
        run: ls -lh target/*.war

      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "Docker Image Tag: ${GITHUB_SHA}"

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:$IMAGE_TAG \
            .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG


  # ==========================================
  # CD JOB
  # ==========================================
  deploy:
    name: Deploy Application
    needs: build
    runs-on: [self-hosted, linux, x64]

    steps:

      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "New image: $IMAGE_NAME:$GITHUB_SHA"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull New Image
        run: |
          docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: Save Previous Image
        run: |
          if docker inspect devops-java-deploy >/dev/null 2>&1; then
            PREVIOUS_IMAGE=$(docker inspect devops-java-deploy --format '{{.Config.Image}}')
            echo "PREVIOUS_IMAGE=$PREVIOUS_IMAGE" >> $GITHUB_ENV
            echo "Previous image: $PREVIOUS_IMAGE"
          else
            echo "PREVIOUS_IMAGE=" >> $GITHUB_ENV
            echo "No previous deployment found."
          fi

      - name: Stop Existing Application
        run: |
          docker rm -f devops-java-deploy 2>/dev/null || true

      - name: Start New Application
        run: |
          docker run -d \
            --name devops-java-deploy \
            -p 8082:8080 \
            $IMAGE_NAME:$IMAGE_TAG

      - name: Health Check
        run: |
          echo "Waiting for application to become healthy..."

          for i in {1..12}; do
            echo "Health check attempt $i/12"

            if curl -fsS http://localhost:8082/devops-lab/ > /tmp/health.html; then
              echo "Application is healthy!"
              cat /tmp/health.html
              exit 0
            fi

            sleep 5
          done

          echo "Application failed health check."
          exit 1

      - name: Deployment Successful
        if: success()
        run: |
          echo "====================================="
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "====================================="
          echo "Image: $IMAGE_NAME:$IMAGE_TAG"

      - name: Automatic Rollback
        if: failure()
        run: |
          echo "====================================="
          echo "       DEPLOYMENT FAILED"
          echo "       STARTING ROLLBACK"
          echo "====================================="

          docker logs devops-java-deploy || true

          docker rm -f devops-java-deploy 2>/dev/null || true

          if [ -n "$PREVIOUS_IMAGE" ]; then

            echo "Rolling back to:"
            echo "$PREVIOUS_IMAGE"

            docker pull "$PREVIOUS_IMAGE"

            docker run -d \
              --name devops-java-deploy \
              -p 8082:8083 \
              "$PREVIOUS_IMAGE"

            sleep 10

            echo "Verifying rollback..."

            curl -f http://localhost:8082/devops-lab/

            echo "====================================="
            echo "       ROLLBACK SUCCESSFUL"
            echo "====================================="

          else
            echo "No previous image available for rollback."
            exit 1
          fi

      - name: Show Running Container
        if: always()
        run: |
          docker ps --filter name=devops-java-deploy