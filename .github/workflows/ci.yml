name: Java DevOps CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================
  # CI JOB
  # ==========================================
  build:
    name: Build, Test & Push Image
    runs-on: [self-hosted, linux, x64]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Java Version
        run: java --version

      - name: Check Maven Version
        run: mvn --version

      - name: Build and Test
        run: mvn clean package

      - name: Verify WAR Artifact
        run: ls -lh target/*.war

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/aashish-cyber/devops-java-lab:v3 \
            .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        run: |
          docker push ghcr.io/aashish-cyber/devops-java-lab:v3


  # ==========================================
  # CD JOB
  # ==========================================
  deploy:
    name: Deploy Application
    needs: build
    runs-on: [self-hosted, linux, x64]

    steps:

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Image from GHCR
        run: |
          docker pull ghcr.io/aashish-cyber/devops-java-lab:v3

      - name: Stop Existing Application
        run: |
          docker rm -f devops-java-deploy 2>/dev/null || true

      - name: Start Application
        run: |
          docker run -d \
            --name devops-java-deploy \
            -p 8082:8080 \
            ghcr.io/aashish-cyber/devops-java-lab:v3

      - name: Wait for Application
        run: sleep 10

      - name: Smoke Test
        run: |
          curl -f http://localhost:8082/devops-lab/

      - name: Deployment Successful
        run: |
          echo "====================================="
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "====================================="

      - name: Show Running Container
        run: |
          docker ps --filter name=devops-java-deploy