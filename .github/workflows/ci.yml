name: Java DevOps CI-CD
#This Workflow is designed to build, test, and deploy a Java application using Maven and Docker. It implements a blue/green deployment strategy to ensure zero downtime during updates.
#We are tryign to implement a blue/green deployment starategy
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Simulate a production verification failure after switching to Green
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/aashish-cyber/devops-java-lab

jobs:

  # ==========================================
  # CI JOB
  # ==========================================
  build:
    name: Build, Test & Push Image
    runs-on: [self-hosted, linux, x64]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Java Version
        run: java --version

      - name: Check Maven Version
        run: mvn --version

      - name: Build and Test
        run: mvn clean package

      - name: Verify WAR Artifact
        run: ls -lh target/*.war

      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "Docker Image Tag: ${GITHUB_SHA}"

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:$IMAGE_TAG \
            .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG


  # ==========================================
  # CD JOB
  # ==========================================
    # ==========================================
  # BLUE/GREEN CD JOB
  # ==========================================
  deploy:
    name: Blue/Green Deployment
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: [self-hosted, linux, x64]

    env:
      BLUE_CONTAINER: devops-java-deploy
      GREEN_CONTAINER: devops-java-green
      NGINX_CONTAINER: devops-nginx
      DOCKER_NETWORK: blue-green-net
      BLUE_PORT: 8082
      GREEN_PORT: 8083
      ROLLBACK_IMAGE: devops-java-app:stable-blue
      ROLLBACK_ARCHIVE: /tmp/devops-java-stable-blue.tar

    steps:
      # 0. Checkout Repository
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4
      # ==========================================
      # 1. Generate Image Tag
      # ==========================================
      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "New image: $IMAGE_NAME:$GITHUB_SHA"


      # ==========================================
      # 2. Login to GHCR
      # ==========================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # 3. Pull New Image
      # ==========================================
      - name: Pull New Image
        run: |
          docker pull $IMAGE_NAME:$IMAGE_TAG


      # ==========================================
      # 4. Verify Blue
      # ==========================================
      - name: Verify Blue Environment
        run: |
          echo "Checking Blue environment..."

          if ! docker inspect $BLUE_CONTAINER >/dev/null 2>&1; then
            echo "ERROR: Blue container does not exist."
            exit 1
          fi

          if ! docker ps \
            --filter "name=$BLUE_CONTAINER" \
            --filter "status=running" \
            -q | grep -q .; then

            echo "ERROR: Blue container is not running."
            exit 1
          fi

          echo "Blue environment is running."

          curl -fsS \
            http://localhost:$BLUE_PORT/devops-lab/ \
            > /tmp/blue-health.html

          cat /tmp/blue-health.html


      # ==========================================
      # 5. Save Current Production Image
      # ==========================================
      - name: Save Blue Image for Rollback
        id: save_blue
        run: |
          echo "Saving the current production image as the Blue rollback version..."

          ACTIVE_CONTAINER=$(docker exec "$NGINX_CONTAINER" nginx -T 2>/dev/null \
            | awk '/server devops-java-(deploy|green):8080;/{sub(":8080;", "", $2); print $2; exit}')
          if [ -z "$ACTIVE_CONTAINER" ]; then
            echo "ERROR: Could not determine the production backend from Nginx."
            exit 1
          fi

          ACTIVE_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$ACTIVE_CONTAINER")
          if [ -z "$ACTIVE_IMAGE" ]; then
            echo "ERROR: Could not determine the production image."
            exit 1
          fi

          docker tag "$ACTIVE_IMAGE" "$ROLLBACK_IMAGE"
          docker save --output "$ROLLBACK_ARCHIVE" "$ROLLBACK_IMAGE"
          docker exec "$NGINX_CONTAINER" cat /etc/nginx/nginx.conf > /tmp/nginx-blue.conf
          sed -i \
            's/server devops-java-green:8080;/server devops-java-deploy:8080;/' \
            /tmp/nginx-blue.conf

          echo "Production backend: $ACTIVE_CONTAINER"
          echo "Production image: $ACTIVE_IMAGE"
          echo "Rollback image: $ROLLBACK_IMAGE"
          echo "Rollback archive: $ROLLBACK_ARCHIVE"


      # ==========================================
      # 5. Remove Old Green
      # ==========================================
      - name: Remove Previous Green
        run: |
          echo "Removing previous Green container..."

          docker rm -f $GREEN_CONTAINER 2>/dev/null || true


      # ==========================================
      # 6. Deploy New Version to GREEN
      # ==========================================
      - name: Deploy New Version to Green
        run: |
          echo "====================================="
          echo "      DEPLOYING NEW VERSION"
          echo "             TO GREEN"
          echo "====================================="

          docker run -d \
            --name $GREEN_CONTAINER \
            --network $DOCKER_NETWORK \
            -p $GREEN_PORT:8080 \
            $IMAGE_NAME:$IMAGE_TAG

          echo "Green container started."

          docker ps --filter "name=$GREEN_CONTAINER"


      # ==========================================
      # 7. Health Check GREEN
      # ==========================================
      - name: Health Check Green
        run: |
          echo "====================================="
          echo "       HEALTH CHECK - GREEN"
          echo "====================================="

          for i in {1..12}; do

            echo "Health check attempt $i/12"

            if curl -fsS \
              http://localhost:$GREEN_PORT/devops-lab/ \
              > /tmp/green-health.html; then

              echo "GREEN is healthy!"
              cat /tmp/green-health.html

              exit 0
            fi

            sleep 5
          done

          echo "GREEN failed health check."

          docker logs $GREEN_CONTAINER || true

          exit 1


      # ==========================================
      # 8. Prepare GREEN Nginx Configuration
      # ==========================================
      - name: Prepare Green Nginx Config
        if: success()
        run: |
          echo "Preparing Nginx configuration for GREEN..."

          cp nginx/nginx.conf /tmp/nginx-green.conf

          sed -i \
            's/server devops-java-deploy:8080;/server devops-java-green:8080;/' \
            /tmp/nginx-green.conf

          echo "Generated GREEN configuration:"
          cat /tmp/nginx-green.conf


      # ==========================================
      # 9. Copy GREEN Config to Nginx
      # ==========================================
      - name: Deploy Green Nginx Config
        if: success()
        run: |
            echo "Updating host-side Nginx configuration..."

            cp /tmp/nginx-green.conf nginx/nginx.conf

            echo "Current Nginx configuration:"
            cat nginx/nginx.conf


      # ==========================================
      # 10. Validate Nginx
      # ==========================================
      - name: Validate Nginx Configuration
        if: success()
        run: |
          docker exec $NGINX_CONTAINER nginx -t


      # ==========================================
      # 11. Switch Traffic to GREEN
      # ==========================================
      - name: Switch Traffic to Green
        if: success()
        run: |
          echo "====================================="
          echo "       SWITCHING TRAFFIC"
          echo "          BLUE → GREEN"
          echo "====================================="

          docker exec $NGINX_CONTAINER nginx -s reload

          echo "Nginx traffic switched to GREEN."


      # ==========================================
      # 12. Verify Production Traffic
      # ==========================================
      - name: Verify Production Traffic
        id: production_test
        if: success()
        run: |
          echo "====================================="
          echo "       VERIFYING PRODUCTION"
          echo "====================================="

          sleep 2

          curl -fsS \
            http://localhost:8080/devops-lab/ \
            > /tmp/production.html

          cat /tmp/production.html

          echo "Production traffic successfully reaches GREEN."

      # ==========================================
      # Optional rollback drill for manual workflow runs
      # ==========================================

      - name: Simulate Post-Deployment Failure
        if: success() && github.event_name == 'workflow_dispatch' && inputs.simulate_failure
        run: |
          echo "====================================="
          echo "   SIMULATING POST-DEPLOYMENT FAILURE"
          echo "====================================="

          exit 1

      # 13. Deployment Successful
      # ==========================================
      - name: Deployment Successful
        if: success()
        run: |
          echo "====================================="
          echo "   BLUE/GREEN DEPLOYMENT SUCCESSFUL"
          echo "====================================="

          echo "Image: $IMAGE_NAME:$IMAGE_TAG"
          echo "Active environment: GREEN"
          echo "Green container: $GREEN_CONTAINER"


      # ==========================================
      # 14. Rollback Traffic to BLUE
      # ==========================================
      - name: Automatic Rollback Traffic to Blue
        if: ${{ always() && steps.save_blue.outcome == 'success' && (failure() || (github.event_name == 'workflow_dispatch' && inputs.simulate_failure)) }}
        run: |
          set -e

          echo "====================================="
          echo "       DEPLOYMENT FAILED"
          echo "       ROLLING BACK TO BLUE"
          echo "====================================="

          echo "Restoring saved Blue image and container..."

          if [ -f "$ROLLBACK_ARCHIVE" ]; then
            docker load --input "$ROLLBACK_ARCHIVE"
          fi

          docker logs $GREEN_CONTAINER 2>/dev/null || true
          docker rm -f "$GREEN_CONTAINER" 2>/dev/null || true
          docker rm -f "$BLUE_CONTAINER" 2>/dev/null || true

          docker run -d \
            --name "$BLUE_CONTAINER" \
            --network "$DOCKER_NETWORK" \
            -p "$BLUE_PORT:8080" \
            "$ROLLBACK_IMAGE"

          echo "Restoring Blue Nginx configuration..."

          cp /tmp/nginx-blue.conf nginx/nginx.conf

          echo "Restored configuration:"
          cat nginx/nginx.conf

          echo "Validating Nginx configuration..."

          docker exec $NGINX_CONTAINER nginx -t

          echo "Reloading Nginx..."

          docker exec $NGINX_CONTAINER nginx -s reload

          echo "Verifying Blue traffic..."

          for i in {1..12}; do
            if curl -fsS http://localhost:8080/devops-lab/ > /tmp/rollback.html; then
              cat /tmp/rollback.html
              if grep -q 'Application Versioning:V5' /tmp/rollback.html; then
                echo "Rollback verification passed on attempt $i/12: production is V5."
                exit 0
              fi
            fi
            sleep 5
          done

          echo "Rollback verification FAILED"
          docker logs "$BLUE_CONTAINER" || true
          exit 1


      # ==========================================
      # 15. Show Final State
      # ==========================================
      - name: Show Running Containers
        if: always()
        run: |
          echo "====================================="
          echo "       FINAL CONTAINER STATE"
          echo "====================================="

          docker ps \
            --filter "name=$BLUE_CONTAINER" \
            --filter "name=$GREEN_CONTAINER" \
            --filter "name=$NGINX_CONTAINER"