services:
  blue:
    image: ${BLUE_IMAGE:-devops-java-app:stable-blue}
    container_name: devops-java-deploy
    ports:
      - "8082:8080"
    networks:
      - blue-green-net
    restart: unless-stopped

  green:
    image: ${GREEN_IMAGE:-ghcr.io/aashish-cyber/devops-java-lab:6831e69a4bed379ef0c1ee3654ed7c1999d7a75e}
    container_name: devops-java-green
    ports:
      - "8083:8080"
    networks:
      - blue-green-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - blue-green-net
    depends_on:
      - blue
      - green
    restart: unless-stopped

networks:
  blue-green-net:
    external: true
